<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘農場</title>
  <style>
    :root {
      --bg: #f4f7f1;
      --card: #ffffff;
      --text: #1f2a1c;
      --muted: #6b7866;
      --accent: #3f8f3a;
      --accent-hover: #327530;
      --accent-soft: #e4f1e1;
      --border: #dfe7da;
      --rate: #d9822b;
      --chip: #f3f6f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141a13;
        --card: #1e261c;
        --text: #e8efe5;
        --muted: #9aa894;
        --accent: #5cb455;
        --accent-hover: #6fc868;
        --accent-soft: #263a23;
        --border: #2d3a2a;
        --rate: #f0a050;
        --chip: #252f23;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 48px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.4rem); letter-spacing: 0.05em; }
    .update {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* 篩選按鈕 */
    .filters {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 10px 0;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .filters button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .filters button:hover { border-color: var(--accent); }
    .filters button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .sort-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    /* 卡片 */
    .list { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .list { grid-template-columns: 1fr 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card.missing { opacity: 0.45; }
    .card-head { display: flex; align-items: center; gap: 10px; }
    .rank {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.9rem;
      display: grid;
      place-items: center;
    }
    .code {
      flex: 1;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 1.25rem;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    button.copy {
      flex: none;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      min-width: 72px;
      transition: background 0.15s;
    }
    button.copy:hover { background: var(--accent-hover); }
    button.copy.done { background: var(--muted); }

    .pets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .pet {
      background: var(--chip);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      font-size: 0.95rem;
    }
    .pet .rate { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pet.hl { background: var(--accent-soft); border-color: var(--accent); }
    .pet.hl .rate { color: var(--rate); }
    .pet.none { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>神秘農場</h1>
      <div class="update">每日 8:00、20:00 更新</div>
    </header>
    <nav class="filters" id="filters"></nav>
    <p class="sort-hint" id="hint"></p>
    <main class="list" id="list"></main>
  </div>

  <script>
    // 資料放在 data.csv：第一列是 ID 和寵物名稱，下面每列一個 ID，數字不用加 %
    // 空白格代表沒有這隻寵物；同一個 ID 出現多次會自動合併（同寵物取較高的數值）
    let PETS = [];
    let data = [];

    function parseCSV(text) {
      const rows = text.replace(/^\uFEFF/, "").split(/\r?\n/)
        .map(line => line.split(",").map(s => s.trim()))
        .filter(cols => cols.some(Boolean));
      const header = rows.shift() || [];
      PETS = header.slice(1).filter(Boolean);
      const map = new Map();
      rows.forEach(cols => {
        const id = cols[0];
        if (!id) return;
        const pets = map.get(id) || {};
        PETS.forEach((name, i) => {
          const raw = (cols[i + 1] || "").replace("%", "").trim();
          if (raw === "") return;
          const val = Number(raw);
          if (Number.isNaN(val)) return;
          if (!(name in pets) || val > pets[name]) pets[name] = val;
        });
        if (Object.keys(pets).length) map.set(id, pets);
      });
      return [...map].map(([id, pets]) => ({
        id,
        pets,
        max: Math.max(...Object.values(pets)),
      }));
    }

    let current = "all";

    const filtersEl = document.getElementById("filters");
    const listEl = document.getElementById("list");
    const hintEl = document.getElementById("hint");

    function renderFilters() {
      const opts = [["all", "全部"], ...PETS.map(p => [p, p])];
      filtersEl.innerHTML = opts
        .map(([key, label]) =>
          `<button data-pet="${key}" class="${key === current ? "active" : ""}">${label}</button>`)
        .join("");
    }

    function render() {
      const score = d => current === "all" ? d.max : (d.pets[current] ?? -1);
      const sorted = [...data].sort((a, b) => score(b) - score(a) || b.max - a.max);

      hintEl.textContent = current === "all"
        ? "依各 ID 最高的寵物 % 排序"
        : `依「${current}」% 排序`;

      listEl.innerHTML = sorted.map((d, i) => {
        // 卡片內：先列固定六種寵物，再列其他寵物（不在 PETS 清單內的）
        const names = [...PETS, ...Object.keys(d.pets).filter(n => !PETS.includes(n))];
        const chips = names.map(n => {
          const v = d.pets[n];
          const has = v !== undefined;
          const hl = has && (current === "all" ? v === d.max : n === current);
          return `<div class="pet${hl ? " hl" : ""}${has ? "" : " none"}">
            <span>${n}</span><span class="rate">${has ? v + "%" : "—"}</span>
          </div>`;
        }).join("");
        const missing = current !== "all" && d.pets[current] === undefined;
        return `
          <div class="card${missing ? " missing" : ""}">
            <div class="card-head">
              <span class="rank">${i + 1}</span>
              <span class="code">${d.id}</span>
              <button class="copy" data-code="${d.id}">複製</button>
            </div>
            <div class="pets">${chips}</div>
          </div>`;
      }).join("");
    }

    filtersEl.addEventListener("click", e => {
      const btn = e.target.closest("button[data-pet]");
      if (!btn) return;
      current = btn.dataset.pet;
      renderFilters();
      render();
    });

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    listEl.addEventListener("click", async e => {
      const btn = e.target.closest("button.copy");
      if (!btn) return;
      const code = btn.dataset.code;
      try {
        await navigator.clipboard.writeText(code);
      } catch {
        fallbackCopy(code);
      }
      btn.textContent = "已複製";
      btn.classList.add("done");
      setTimeout(() => {
        btn.textContent = "複製";
        btn.classList.remove("done");
      }, 1500);
    });

    fetch("data.csv", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(text => {
        data = parseCSV(text);
        renderFilters();
        render();
      })
      .catch(() => {
        hintEl.textContent = "資料載入失敗，請稍後重新整理";
      });
  </script>
</body>
</html>
