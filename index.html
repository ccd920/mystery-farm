<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘農場</title>
  <style>
    :root {
      --bg: #f4f7f1;
      --card: #ffffff;
      --text: #1f2a1c;
      --muted: #6b7866;
      --accent: #3f8f3a;
      --accent-hover: #327530;
      --accent-soft: #e4f1e1;
      --border: #dfe7da;
      --rate: #d9822b;
      --chip: #f3f6f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141a13;
        --card: #1e261c;
        --text: #e8efe5;
        --muted: #9aa894;
        --accent: #5cb455;
        --accent-hover: #6fc868;
        --accent-soft: #263a23;
        --border: #2d3a2a;
        --rate: #f0a050;
        --chip: #252f23;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 10px 16px 32px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    h1 { font-size: 1.35rem; letter-spacing: 0.05em; }
    .update { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }

    /* 篩選列（捲動時固定在上方） */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 6px 0 8px;
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .filters { display: flex; gap: 4px; }
    .toolbar button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 5px 4px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .filters button { flex: 1 1 0; min-width: 0; }
    .toolbar button:hover { border-color: var(--accent); }
    .filters button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    /* 已設定的寵物：橘色框＋打勾 */
    .filters button.set {
      border: 2px solid var(--rate);
      color: var(--rate);
      padding: 4px 3px;
    }
    .filters button.set::before { content: "✓"; }
    .filters button.set.active { color: #fff; }
    .meta { display: flex; align-items: center; gap: 6px; }
    .sort-hint { flex: 1; color: var(--muted); font-size: 0.8rem; }
    .actions button { font-size: 0.8rem; padding: 3px 12px; }
    .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
    .actions button:disabled:hover { border-color: var(--border); }

    /* 卡片 */
    .list { display: grid; gap: 8px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .list { grid-template-columns: 1fr 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card.missing { opacity: 0.45; }
    .card-head { display: flex; align-items: center; gap: 8px; }
    .rank {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      display: grid;
      place-items: center;
    }
    .code {
      flex: 1;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    button.copy {
      flex: none;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      min-width: 60px;
      transition: background 0.15s;
    }
    button.copy:hover { background: var(--accent-hover); }
    button.copy.done { background: var(--muted); }

    .pets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .pet {
      background: var(--chip);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 2px 7px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      font-size: 0.85rem;
    }
    .pet .rate { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pet.hl { background: var(--accent-soft); border-color: var(--accent); }
    .pet.hl .rate { color: var(--rate); }
    .pet.none { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>神秘農場</h1>
      <div class="update">每日 8:00、20:00 更新</div>
    </header>
    <div class="toolbar">
      <nav class="filters" id="filters"></nav>
      <div class="meta">
        <p class="sort-hint" id="hint"></p>
        <div class="actions">
          <button id="setBtn">已設定</button>
          <button id="clearBtn">清除</button>
        </div>
      </div>
    </div>
    <main class="list" id="list"></main>
  </div>

  <script>
    // 資料放在 data.csv：第一列是 ID 和寵物名稱，下面每列一個 ID，數字不用加 %
    // 空白格代表沒有這隻寵物；同一個 ID 出現多次會自動合併（同寵物取較高的數值）
    let PETS = [];
    let data = [];

    function parseCSV(text) {
      const rows = text.replace(/^\uFEFF/, "").split(/\r?\n/)
        .map(line => line.split(",").map(s => s.trim()))
        .filter(cols => cols.some(Boolean));
      const header = rows.shift() || [];
      PETS = header.slice(1).filter(Boolean);
      const map = new Map();
      rows.forEach(cols => {
        const id = cols[0];
        if (!id) return;
        const pets = map.get(id) || {};
        PETS.forEach((name, i) => {
          const raw = (cols[i + 1] || "").replace("%", "").trim();
          if (raw === "") return;
          const val = Number(raw);
          if (Number.isNaN(val)) return;
          if (!(name in pets) || val > pets[name]) pets[name] = val;
        });
        if (Object.keys(pets).length) map.set(id, pets);
      });
      return [...map].map(([id, pets]) => ({
        id,
        pets,
        max: Math.max(...Object.values(pets)),
      }));
    }

    let current = "all";

    // 已設定的寵物，存在這台裝置的瀏覽器裡，重新整理後還在
    const SET_KEY = "mystery-farm-set";
    let setPets = new Set();
    try {
      setPets = new Set(JSON.parse(localStorage.getItem(SET_KEY)) || []);
    } catch {}
    function saveSet() {
      try {
        localStorage.setItem(SET_KEY, JSON.stringify([...setPets]));
      } catch {}
    }

    const filtersEl = document.getElementById("filters");
    const listEl = document.getElementById("list");
    const hintEl = document.getElementById("hint");
    const setBtn = document.getElementById("setBtn");
    const clearBtn = document.getElementById("clearBtn");

    function renderFilters() {
      const opts = [["all", "全部"], ...PETS.map(p => [p, p])];
      filtersEl.innerHTML = opts
        .map(([key, label]) => {
          const cls = [key === current && "active", setPets.has(key) && "set"].filter(Boolean).join(" ");
          return `<button data-pet="${key}" class="${cls}">${label}</button>`;
        })
        .join("");
      // 「全部」不能設定；已設定的寵物再按一次會取消
      setBtn.disabled = current === "all";
      setBtn.textContent = setPets.has(current) ? "取消設定" : "已設定";
      clearBtn.disabled = setPets.size === 0;
    }

    setBtn.addEventListener("click", () => {
      if (current === "all") return;
      if (setPets.has(current)) setPets.delete(current);
      else setPets.add(current);
      saveSet();
      renderFilters();
    });

    clearBtn.addEventListener("click", () => {
      setPets.clear();
      saveSet();
      renderFilters();
    });

    function render() {
      // 排序鍵：先比選中的寵物，相同時再依該 ID 其他寵物 % 由高到低逐一比較
      // 「全部」時直接從最高的 % 開始逐一比較；沒有該寵物的排最後
      const key = d => {
        const others = Object.entries(d.pets)
          .filter(([n]) => current === "all" || n !== current)
          .map(([, v]) => v)
          .sort((x, y) => y - x);
        return current === "all" ? others : [d.pets[current] ?? -1, ...others];
      };
      const cmp = (a, b) => {
        const ka = key(a), kb = key(b);
        for (let i = 0; i < Math.max(ka.length, kb.length); i++) {
          const diff = (kb[i] ?? -1) - (ka[i] ?? -1);
          if (diff) return diff;
        }
        return 0;
      };
      const sorted = [...data].sort(cmp);

      hintEl.textContent = current === "all"
        ? "依各 ID 最高的寵物 % 排序"
        : `依「${current}」% 排序`;

      listEl.innerHTML = sorted.map((d, i) => {
        // 卡片內：先列固定六種寵物，再列其他寵物（不在 PETS 清單內的）
        const names = [...PETS, ...Object.keys(d.pets).filter(n => !PETS.includes(n))];
        const chips = names.map(n => {
          const v = d.pets[n];
          const has = v !== undefined;
          const hl = has && (current === "all" ? v === d.max : n === current);
          return `<div class="pet${hl ? " hl" : ""}${has ? "" : " none"}">
            <span>${n}</span><span class="rate">${has ? v + "%" : "—"}</span>
          </div>`;
        }).join("");
        const missing = current !== "all" && d.pets[current] === undefined;
        return `
          <div class="card${missing ? " missing" : ""}">
            <div class="card-head">
              <span class="rank">${i + 1}</span>
              <span class="code">${d.id}</span>
              <button class="copy" data-code="${d.id}">複製</button>
            </div>
            <div class="pets">${chips}</div>
          </div>`;
      }).join("");
    }

    filtersEl.addEventListener("click", e => {
      const btn = e.target.closest("button[data-pet]");
      if (!btn) return;
      current = btn.dataset.pet;
      renderFilters();
      render();
    });

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    listEl.addEventListener("click", async e => {
      const btn = e.target.closest("button.copy");
      if (!btn) return;
      const code = btn.dataset.code;
      try {
        await navigator.clipboard.writeText(code);
      } catch {
        fallbackCopy(code);
      }
      btn.textContent = "已複製";
      btn.classList.add("done");
      setTimeout(() => {
        btn.textContent = "複製";
        btn.classList.remove("done");
      }, 1500);
    });

    fetch("data.csv", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(text => {
        data = parseCSV(text);
        renderFilters();
        render();
      })
      .catch(() => {
        hintEl.textContent = "資料載入失敗，請稍後重新整理";
      });
  </script>
</body>
</html>
